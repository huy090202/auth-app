info:
  name: "A half session cannot read /me"
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/api/me"

runtime:
  scripts:
    - type: tests
      code: |-
        test("401 - not fully signed in", function() {
          expect(res.getStatus()).to.equal(401);
          expect(res.getBody().error).to.equal("second_factor_required");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Until the second factor is done the session does not open protected routes. **Expected: 401 `second_factor_required`.**
