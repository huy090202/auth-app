info:
  name: "Read my profile and factors"
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/api/me"

runtime:
  scripts:
    - type: tests
      code: |-
        test("200 - PIN is enrolled", function() {
          expect(res.getStatus()).to.equal(200);
          expect(res.getBody().username).to.equal(bru.getVar("username") || bru.getEnvVar("username"));
          expect(res.getBody().factors.pin).to.equal(true);
          expect(res.getBody().factors.webauthn).to.be.an("array").that.is.empty;
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  **Expected: 200 `{username, email, factors: {pin: true, webauthn: []}}`.**
