info:
  name: "Set a PIN"
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/api/me/pin"
  headers:
    - name: Content-Type
      value: "application/json"
  body:
    type: json
    data: |-
      { "pin": "{{pin}}" }

runtime:
  scripts:
    - type: tests
      code: |-
        test("201 - PIN set", function() {
          expect(res.getStatus()).to.equal(201);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  bff forwards to auth-gate `POST /api/factors/pin` for this user. **Expected: 201 `{}`.**
  A trivially guessable PIN is rejected by auth-gate (400).
