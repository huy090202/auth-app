AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >-
  auth-app: the bff Lambda and the SPA bucket behind one CloudFront distribution.

Parameters:
  Stage:
    Type: String
    Default: stg
    AllowedPattern: "[a-z0-9-]+"
  AuthGateBaseUrl:
    Type: String
    Description: auth-gate's one URL, e.g. https://xxxx.cloudfront.net
  AuthGateClientId:
    Type: String
    Default: ""
    Description: Empty on the first deploy; set after 02-register-client.sh stg.
  Trace:
    Type: String
    Default: "1"
    AllowedValues: ["0", "1"]

Resources:
  Table:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub auth-app-${Stage}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: pk, AttributeType: S }
        - { AttributeName: sk, AttributeType: S }
      KeySchema:
        - { AttributeName: pk, KeyType: HASH }
        - { AttributeName: sk, KeyType: RANGE }

  Bff:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub auth-app-${Stage}-bff
      CodeUri: ../bff/dist
      Handler: index.handler
      Runtime: nodejs22.x
      Architectures: [arm64]
      MemorySize: 256
      Timeout: 10
      FunctionUrlConfig:
        AuthType: NONE
      Environment:
        Variables:
          STAGE: !Ref Stage
          TABLE: !Ref Table
          AUTHGATE_BASE_URL: !Ref AuthGateBaseUrl
          AUTHGATE_CLIENT_ID: !Ref AuthGateClientId
          TRACE: !Ref Trace
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:UpdateItem
                - dynamodb:TransactWriteItems
              Resource: !GetAtt Table.Arn
            - Effect: Allow
              Action: ssm:GetParameter
              Resource: !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/auth-app/${Stage}/*"
            # SecureStrings use the account's default aws/ssm key; only through SSM.
            - Effect: Allow
              Action: kms:Decrypt
              Resource: !Sub "arn:${AWS::Partition}:kms:${AWS::Region}:${AWS::AccountId}:key/*"
              Condition:
                StringEquals:
                  kms:ViaService: !Sub ssm.${AWS::Region}.amazonaws.com

  SiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub auth-app-${Stage}-site-${AWS::AccountId}
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced

  SiteOac:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub auth-app-${Stage}-site
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: CloudFrontOnly
            Effect: Allow
            Principal: { Service: cloudfront.amazonaws.com }
            Action: s3:GetObject
            Resource: !Sub "${SiteBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${Distribution}"

  # SPA routes (/docs/..., /app/...) have no file in S3: any path whose last segment
  # has no dot is served /index.html. Only on the site behaviour, never on /api/*.
  SpaRewrite:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub auth-app-${Stage}-spa-rewrite
      AutoPublish: true
      FunctionConfig:
        Comment: Serve index.html for SPA routes
        Runtime: cloudfront-js-2.0
      FunctionCode: |
        function handler(event) {
          var req = event.request;
          var last = req.uri.substring(req.uri.lastIndexOf('/') + 1);
          if (last.indexOf('.') === -1) req.uri = '/index.html';
          return req;
        }

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub auth-app ${Stage}
        HttpVersion: http2and3
        PriceClass: PriceClass_200
        DefaultRootObject: index.html
        Origins:
          - Id: api
            DomainName: !Select [2, !Split ["/", !GetAtt BffUrl.FunctionUrl]]
            CustomOriginConfig: { OriginProtocolPolicy: https-only, OriginSSLProtocols: [TLSv1.2] }
            OriginCustomHeaders:
              - HeaderName: x-origin-verify
                HeaderValue: !Sub "{{resolve:ssm:/auth-app/${Stage}/origin-verify}}"
          - Id: site
            DomainName: !GetAtt SiteBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt SiteOac.Id
            S3OriginConfig: { OriginAccessIdentity: "" }
        DefaultCacheBehavior:
          TargetOriginId: site
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD]
          CachedMethods: [GET, HEAD]
          Compress: true
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6 # Managed-CachingOptimized
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt SpaRewrite.FunctionMetadata.FunctionARN
        CacheBehaviors:
          - PathPattern: /api/*
            TargetOriginId: api
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE]
            CachedMethods: [GET, HEAD]
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad # Managed-CachingDisabled
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac # Managed-AllViewerExceptHostHeader
        # No CustomErrorResponses: they are distribution-wide and would turn bff's own
        # 403/404 JSON on /api/* into index.html 200. SpaRewrite serves the shell instead.

Outputs:
  BaseUrl:
    Description: The one URL of the site (docs, demo and /api).
    Value: !Sub "https://${Distribution.DomainName}"
  RawBffUrl:
    Description: Direct Function URL (must answer 401 without CloudFront).
    Value: !GetAtt BffUrl.FunctionUrl
  SiteBucket:
    Value: !Ref SiteBucket
  DistributionId:
    Value: !Ref Distribution
